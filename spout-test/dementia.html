<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modern room - dementia triggers</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: absolute; left: 12px; top: 10px; font: 22px/1.35 system-ui, sans-serif; color: #fff;
         background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 6px; white-space: pre; display: none; }
  #msg { position: absolute; left: 12px; bottom: 10px; font: 16px system-ui, sans-serif; color: #888; }
</style>
</head>
<body>
<!-- DEMENTIA TRIGGERS: the "Modern - Glenda's things" panorama (room_pano_modern_glenda.jpg) with live effects drawn on
     top in a shader, so nothing needed re-rendering in Blender. Each effect is placed using the room's real geometry
     (build_recess_test.py / build_modern_glenda.py): camera at the room centre, 1.12 m up, panorama centre = north wall.

       tiles    kitchen wall tiles in muted colours that shift and swim                 (complex patterns -> dizziness)
                + kitchen floor tiles that look glossy and wet, with rippling reflections (glossy floors -> fear of slipping)
       hole     the rug darkens, then drops away into a pit, then comes back            (dark rugs -> perceived holes)
       stairs   a dark doorway with steps climbing into blackness, south-east corner    (dark zones / shadows)
       flicker  the lights dip and the downlights / lamp cut out now and then           (lighting quality)
       night    dark outside the window ("dusk" = daylight fades over ~90 s)            (sundowning)
       audio    a radio and a group of people talking over each other                   (acoustic overload)

     URL options (the starting state): tiles=0 hole=0|dark|pit|sink stairs=0 flicker=0 night=0|1|dusk audio=0 vol=0.8 hud=1
                  and one per sound layer: radio=0 talk=0
     Tablet: every option below is a control on the remote (control.html), via remote.js. Reset scene puts them back.
     Keyboard (a keyboard on the room PC): 1 tiles, 2 hole, 3 stairs, 4 flicker, 5 dark outside, 6 all sound, H status.
     Sound layers: to add one, put the file in audio/ and add one line to LAYERS below; it gets its own switch and volume.
     Flicker is kept below 3 changes a second (photosensitivity guidance). -->
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg">Loading…</div>
<script src="remote.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const opt = (k, d) => Q.has(k) ? Q.get(k) : d;
const on = { tiles: opt('tiles', '1') !== '0', hole: opt('hole', 'sink') !== '0', stairs: opt('stairs', '1') !== '0',
             flicker: opt('flicker', '1') !== '0', night: opt('night', '1') !== '0', audio: opt('audio', '1') !== '0' };
let HOLE_MODE = ['dark', 'pit', 'sink'].includes(opt('hole', 'sink')) ? opt('hole', 'sink') : 'sink';
const DUSK = opt('night', '1') === 'dusk';
let VOL = Math.max(0, Math.min(1, parseFloat(opt('vol', '0.8')) || 0));
let sky = DUSK ? 'dusk' : on.night ? 'night' : 'day';   // outside: day / dark / dusk falling
let duskFrom = 0;                                        // when the dusk fade started (scene seconds)

// sound layers: id, what the tablet calls it, file, level, left(-1)/right(+1)
const LAYERS = [
  { id: 'radio', label: 'Radio (kitchen)', src: 'audio/dementia_radio.mp3', gain: 0.75, pan: -0.45 },   // radio left on in the kitchen
  { id: 'talk',  label: 'Group talking',   src: 'audio/dementia_group_talk.mp3', gain: 0.9, pan: 0.3 },   // people talking over each other
];
const layer = {};   // id -> { on, vol }
for (const L of LAYERS) layer[L.id] = { on: opt(L.id, '1') !== '0', vol: L.gain };
let showHud = opt('hud', '0') === '1';

// ------------------------------------------------------------------ WebGL: one full-screen pass over the panorama
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: false, preserveDrawingBuffer: false });
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `
precision highp float;
uniform sampler2D pano;
uniform vec2 res;
uniform float time, tiles, darkRug, sink, stairs, light, spots, night;
const float PI = 3.14159265;
const float EYE = 1.12;

vec3 P(vec3 d) {                                   // panorama lookup (Blender equirect, centre = +y, right = +x)
  d = normalize(d);
  return texture2D(pano, vec2(0.5 + atan(d.x, d.y) / (2. * PI), 0.5 - asin(clamp(d.z, -1., 1.)) / PI)).rgb;
}
float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec3 hsv(float h, float s, float v) { vec3 k = clamp(abs(mod(h * 6. + vec3(0., 4., 2.), 6.) - 3.) - 1., 0., 1.); return v * mix(vec3(1.), k, s); }
// at night there is no sun patch on the rug: bring the sunlit part down to the shaded level, keeping the rug's red
vec3 nightRug(vec3 c, float n) {
  float l = lum(c), k = min(1., 0.34 / max(l, 0.01));
  vec3 s = c * k; float ls = lum(s);
  s = ls + (s - ls) * (1. + (1. - k) * 0.8);
  return mix(c, s, n);
}
float archZ(float y) { float u = clamp((y - 0.525) / 1.625, -1., 1.); return 1.55 + 0.33 * sqrt(1. - u * u); }

// stairs going up beyond a doorway in the east wall (x = 3.2, y -2.55..-1.75, 2 m high). The stairwell runs straight
// away from the viewer (along the line from the room centre through the doorway), so the steps are seen head-on.
const vec2 DC = vec2(3.2, -2.15);
vec3 stairwell(vec3 o, vec3 d) {
  vec2 F = normalize(DC), N = vec2(-F.y, F.x);
  vec3 q = o; float tr = 0.; float hPrev = 0.;
  for (int i = 0; i < 110; i++) {
    q += d * 0.03; tr += 0.03;
    vec2 r = q.xy - DC;
    float s = dot(r, F), l = dot(r, N);
    float sd = s - 0.3;
    float h = sd < 0. ? 0. : 0.18 * (1. + floor(sd / 0.26));             // steps climbing away into the dark
    float c = 2.0 + max(0., sd) * 0.69;
    // lit only from the room behind you: bright at the threshold, gone to black a few steps up
    float fade = exp(-tr * 1.25);
    vec3 base = vec3(0.4, 0.37, 0.34) * fade;
    if (q.z < h) {
      bool riser = h > hPrev + 0.01;                                     // risers face the viewer and catch the light
      float nose = smoothstep(0.0, 0.04, fract(max(sd, 0.) / 0.26));
      return base * (riser ? 0.85 : 0.5 * mix(0.4, 1., nose));
    }
    if (abs(l) > 0.36) return base * (l > 0. ? 0.5 : 0.38);              // side walls
    if (q.z > c) return base * 0.2;                                       // sloping ceiling
    if (tr > 3.6) break;
    hPrev = h;
  }
  return vec3(0.);
}

void main() {
  vec2 uv = gl_FragCoord.xy / res;
  float lon = (uv.x - 0.5) * 2. * PI, lat = (uv.y - 0.5) * PI;
  vec3 d = vec3(cos(lat) * sin(lon), cos(lat) * cos(lon), sin(lat));
  vec3 o = vec3(0., 0., EYE);
  vec3 col = P(d);
  float L0 = lum(col);
  bool fixedLight = false;                         // pixels that get no room-light flicker (outside, the stairwell void)

  // ---------------------------------------------------------------- floor hits: the rug / pit and the kitchen tiles
  if (d.z < -0.001) {
    float tf = EYE / -d.z; vec3 f = o + d * tf;
    vec2 R0 = vec2(-1.19, 0.66), R1 = vec2(1.44, 2.64);
    bool inRug = f.x > R0.x && f.x < R1.x && f.y > R0.y && f.y < R1.y;
    if (inRug) {
      // at night there is no sun patch on the rug: pull the bright (sunlit) part down to the shaded level
      col = nightRug(col, night);
      if (sink > 0.002) {
        // the rug drops to depth "sink"; rays from the rim go down until they hit the sunk rug or a pit wall
        float tb = (EYE + sink) / -d.z;
        float tx = d.x > 0. ? R1.x / d.x : R0.x / d.x;
        float ty = R1.y / max(d.y, 1e-4);
        float ts = min(tx, ty);
        if (tb <= ts) {
          vec3 q = o + d * tb;
          vec3 rug = nightRug(P(vec3(q.x, q.y, -EYE)), night);
          col = rug * exp(-sink * 1.1);
        } else {
          float z = EYE + d.z * ts;                                           // negative: depth down the wall
          vec3 wall = mix(vec3(0.36, 0.27, 0.2), vec3(0.08, 0.06, 0.05), clamp(-z / 0.8, 0., 1.));
          col = wall * exp(z * 1.1) * (z > -0.03 ? 1.5 : 1.);                // torn rug edge at the rim
        }
        col *= 1. - 0.15 * darkRug;
      } else {
        col *= 1. - 0.82 * darkRug;                                           // dark rug read as a hole
      }
    }
    // kitchen floor seen through the arch, in front of the base units (front plane x = 4.8): glossy, wet-looking tiles
    if (tiles > 0.001 && f.x > 3.2 && f.x < 4.79 && f.y > -1.65 && f.y < 2.855) {
      float ta = 3.2 / max(d.x, 1e-4); vec3 a = o + d * ta;
      if (a.y > -1.1 && a.y < 2.15 && a.z < archZ(a.y)) {
        float mx = max(col.r, max(col.g, col.b)), mn = min(col.r, min(col.g, col.b));
        float sat = (mx - mn) / max(mx, 0.01);
        float key = smoothstep(0.35, 0.48, L0) * (1. - smoothstep(0.10, 0.17, sat));   // the floor only, not the basket / bowls
        // mirror image of the kitchen: reflect the view ray off the floor, find where it meets the unit fronts or the
        // ceiling, and look that point up in the panorama. A slow ripple makes it read as a wet, slippery surface.
        vec3 r = vec3(d.x, d.y, -d.z);
        r.xy += 0.012 * vec2(sin(f.x * 23. + time * 1.7), sin(f.y * 19. - time * 1.3));
        float t1 = (4.8 - f.x) / max(r.x, 1e-3);
        vec3 h = vec3(f.xy, 0.) + r * t1;
        if (h.z > 2.244) h = vec3(f.xy, 0.) + r * (2.244 / max(r.z, 1e-3));
        vec3 refl = P(h - o);
        vec2 g = abs(fract(f.xy / 0.3) - 0.5);                              // 30 cm tiles, thin dark grout
        float grout = smoothstep(0.47, 0.49, max(g.x, g.y));
        vec3 wet = col * 0.42 + refl * 0.5;
        wet += vec3(1.) * smoothstep(0.85, 1., lum(refl)) * 0.6;             // hot spots where the lights reflect
        wet = mix(wet, col * 0.3, grout * 0.7);
        col = mix(col, wet, key * tiles);
      }
    }
  }

  // ---------------------------------------------------------------- kitchen wall tiles: muted colours that shift and swim
  // splashback on the kitchen's east wall (x = 5.4), between the worktop (0.90 m) and the wall units (1.42 m)
  if (tiles > 0.001 && d.x > 0.001) {
    float ta = 3.2 / d.x; vec3 a = o + d * ta;
    float tw = 5.395 / d.x; vec3 w = o + d * tw;
    float tf = 5.06 / d.x; vec3 u = o + d * tf;                              // under the wall units' front edge
    if (a.y > -1.1 && a.y < 2.15 && a.z < archZ(a.y) && w.y > -1.65 && w.y < 2.235 && w.z > 0.905 && w.z < 1.42 && u.z < 1.42) {
      float mx = max(col.r, max(col.g, col.b)), mn = min(col.r, min(col.g, col.b));
      float key = smoothstep(0.18, 0.28, L0) * (1. - smoothstep(0.2, 0.3, (mx - mn) / max(mx, 0.01)));   // tiles, not the kettle / microwave / bananas
      float t = time;
      vec2 p = vec2(w.y, w.z);
      p += 0.035 * vec2(sin(p.y * 9. + t * 1.4), cos(p.x * 7. - t * 1.2));
      vec2 cell = floor(p / 0.15), fc = fract(p / 0.15) - 0.5;
      float hue = hash(cell) + t * 0.05 + 0.15 * sin(t * 0.6 + cell.x * 0.7);
      vec3 tc = hsv(hue, 0.42, 0.8);                                         // muted, not neon
      if (abs(fc.x) + abs(fc.y) < 0.22 + 0.06 * sin(t * 1.6 + hash(cell + 7.) * 6.)) tc = hsv(hue + 0.5, 0.35, 0.55);
      if (max(abs(fc.x), abs(fc.y)) > 0.45) tc = vec3(0.35, 0.33, 0.3);       // grout
      col = mix(col, tc * clamp(L0 / 0.6, 0.5, 1.15), key * tiles);
    }
  }

  // ---------------------------------------------------------------- east wall, south-east corner: dark doorway + stairs
  if (stairs > 0.001 && d.x > 0.001) {
    float tw = 3.2 / d.x; vec3 w = o + d * tw;
    if (w.z > 0. && w.y > -2.855 && w.y < -1.1) {
      float k = stairs;
      if (w.y > -2.55 && w.y < -1.75 && w.z < 2.0) {
        col = mix(col, stairwell(w, d), k); fixedLight = true;
      } else if (w.y > -2.62 && w.y < -1.68 && w.z < 2.07) {
        col = mix(col, vec3(0.16, 0.15, 0.14), k);                           // dim architrave
      }
    }
  }
  // a soft pool of shadow around the doorway, over the walls, floor and ceiling of that corner
  if (stairs > 0.001 && !fixedLight) {
    vec3 tb = vec3((d.x > 0. ? 3.2 : -3.2) / d.x, (d.y > 0. ? 2.855 : -2.855) / d.y, d.z > 0. ? (2.244 - EYE) / d.z : EYE / -d.z);
    vec3 hp = o + d * min(tb.x, min(tb.y, tb.z));
    vec3 cd = (hp - vec3(3.2, -2.15, 1.0)) * vec3(1., 1., 0.8);
    col *= 1. - stairs * 0.7 * exp(-dot(cd, cd) / 1.5);
  }

  // ---------------------------------------------------------------- the window: dark outside
  if (night > 0.001 && d.x < -0.001) {
    float tw = -3.2 / d.x; vec3 w = o + d * tw;
    if (w.y > -0.12 && w.y < 1.12 && w.z > 0.73 && w.z < 1.82) {
      float mx = max(col.r, max(col.g, col.b)), mn = min(col.r, min(col.g, col.b));
      float white = smoothstep(0.55, 0.75, L0) * (1. - smoothstep(0.12, 0.22, (mx - mn) / max(mx, 0.01)))
                  * smoothstep(1.17, 1.22, w.z);                             // the blind is only in the top half
      vec3 dark = vec3(0.010, 0.014, 0.035) + vec3(0.006, 0.009, 0.02) * L0;
      vec3 blind = col * vec3(0.42, 0.44, 0.52);                             // blinds, lit only from inside
      col = mix(col, mix(dark, blind, white), night);
      fixedLight = white < 0.5;
    }
  }

  // ---------------------------------------------------------------- room lighting: evening, flicker, lights cutting out
  if (!fixedLight) {
    col *= mix(1., 0.8, night) * mix(vec3(1.), vec3(1.04, 0.97, 0.88), night);   // evening: dimmer, warmer
    float spot = smoothstep(0.9, 0.99, L0);                                     // downlights and the lamp shade
    col *= light;
    col = mix(col, col * 0.5, spot * (1. - spots));
  }
  gl_FragColor = vec4(col, 1.);
}`;

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const ap = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(ap); gl.vertexAttribPointer(ap, 2, gl.FLOAT, false, 0, 0);
const U = {}; for (const n of ['pano', 'res', 'time', 'tiles', 'darkRug', 'sink', 'stairs', 'light', 'spots', 'night']) U[n] = gl.getUniformLocation(prog, n);

let ready = false;
const img = new Image();
img.onload = () => {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.pano, 0); ready = true; document.getElementById('msg').textContent = '';
};
img.src = 'assets/room_pano_modern_glenda.jpg';

function resize() { const w = innerWidth, h = innerHeight; if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); } }

// ------------------------------------------------------------------ effect state, smoothed so toggles fade in and out
const ease = (x) => x * x * (3 - 2 * x);
const level = { tiles: 0, hole: 0, stairs: 0, night: 0, flicker: 0 };
const start = performance.now();

// rug cycle (45 s): normal 6 s -> darkens 6 s -> drops away 3 s -> pit 22 s -> rug fades back 8 s
function rugState(t) {
  if (HOLE_MODE === 'dark') return { dark: 1, sink: 0 };
  if (HOLE_MODE === 'pit') return { dark: 1, sink: 4 };
  const c = t % 45;
  if (c < 6) return { dark: 0, sink: 0 };
  if (c < 12) return { dark: ease((c - 6) / 6), sink: 0 };
  if (c < 15) { const k = (c - 12) / 3; return { dark: 1, sink: 4 * k * k }; }     // falls, accelerating
  if (c < 37) return { dark: 1, sink: 4 };
  const k = ease((c - 37) / 8); return { dark: 1 - k, sink: k < 0.5 ? 4 : 0, fadeBack: k };
}

// flicker: every 4-12 s a short burst of dips (each >= 0.34 s apart, so under 3 changes per second)
let flick = { light: 1, spots: 1, next: 3, events: [] };
function flickerState(t) {
  if (t > flick.next) {
    const n = 2 + Math.floor(Math.random() * 3); let s = t;
    for (let i = 0; i < n; i++) { const len = 0.12 + Math.random() * 0.2; flick.events.push([s, s + len, 0.62 + Math.random() * 0.15]); s += len + 0.34 + Math.random() * 0.3; }
    if (Math.random() < 0.35) flick.events.push([s + 0.2, s + 2.2 + Math.random() * 2, 0.7]);   // sometimes stays dim for a moment
    flick.next = s + 4 + Math.random() * 8;
  }
  flick.events = flick.events.filter(e => e[1] > t);
  const e = flick.events.find(e => e[0] <= t);
  return e ? { light: e[2], spots: 0 } : { light: 1, spots: 1 };
}

let frames = 0, fps = 0, fpsT = performance.now(), lastT = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!ready) return;
  resize();
  const t = (performance.now() - start) / 1000;
  const step = Math.min(0.5, t - lastT) / 1.2; lastT = t;      // ~1.2 s fade for any toggle, whatever the frame rate
  for (const k in level) { const target = on[k] ? 1 : 0; level[k] += Math.max(-step, Math.min(step, target - level[k])); }
  const r = rugState(t);
  const nightTarget = sky === 'dusk' ? Math.min(1, (t - duskFrom) / 90) : 1;
  const f = flickerState(t);
  const fl = level.flicker;

  let darkRug = r.dark * level.hole, sink = r.sink * level.hole;
  if (r.fadeBack !== undefined && r.fadeBack >= 0.5) { sink = 0; darkRug = (1 - r.fadeBack) * 2 * level.hole; }   // rug back at floor level, lightening
  gl.uniform2f(U.res, cv.width, cv.height);
  gl.uniform1f(U.time, t);
  gl.uniform1f(U.tiles, level.tiles);
  gl.uniform1f(U.darkRug, darkRug);
  gl.uniform1f(U.sink, sink);
  gl.uniform1f(U.stairs, level.stairs);
  gl.uniform1f(U.night, level.night * ease(nightTarget));
  gl.uniform1f(U.light, 1 + (f.light - 1) * fl);
  gl.uniform1f(U.spots, 1 + (f.spots - 1) * fl);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  frames++; const now = performance.now();
  if (now - fpsT > 1000) { fps = frames; frames = 0; fpsT = now; hud(); }
  audioLevels();
}
requestAnimationFrame(frame);

// ------------------------------------------------------------------ audio: radio + group talking, looped
let actx = null, master = null, tracks = [];
async function startAudio() {
  if (actx) { actx.resume(); return; }
  actx = new AudioContext();
  master = actx.createGain(); master.gain.value = VOL; master.connect(actx.destination);
  for (const d of LAYERS) {
    try {
      const data = await (await fetch(d.src)).arrayBuffer();
      const b = await actx.decodeAudioData(data);
      const s = actx.createBufferSource(); s.buffer = b; s.loop = true;
      const g = actx.createGain(); g.gain.value = 0;
      const p = actx.createStereoPanner(); p.pan.value = d.pan;
      s.connect(g).connect(p).connect(master);
      s.start(0, Math.random() * b.duration);
      tracks.push({ g, id: d.id, phase: Math.random() * 6 });
    } catch (e) { console.warn('audio', d.src, e); }
  }
  if (actx.state !== 'running') document.getElementById('msg').textContent = 'Click once to start the sound';
}
function audioLevels() {
  if (!actx) return;
  const t = actx.currentTime;
  for (const tr of tracks) {
    const swell = 0.8 + 0.2 * Math.sin(t * 0.13 + tr.phase) + 0.1 * Math.sin(t * 0.41 + tr.phase * 2);   // levels drift, never settle
    const L = layer[tr.id];
    const target = on.audio && L.on ? L.vol * swell : 0;
    tr.g.gain.setTargetAtTime(target, t, 0.6);      // ~1-2 s fade in/out, never a hard cut
  }
  if (master) master.gain.setTargetAtTime(VOL, t, 0.3);
}
startAudio();
addEventListener('click', () => { startAudio(); if (actx && actx.state === 'running') document.getElementById('msg').textContent = ''; });

// ------------------------------------------------------------------ tablet controls (remote.js) + keyboard + status
const sceneT = () => (performance.now() - start) / 1000;
const CONTROLS = [
  { id: 'tiles',   type: 'toggle', group: 'Effects', key: '1', label: 'Patterned tiles + wet-look floor' },
  { id: 'hole',    type: 'toggle', group: 'Effects', key: '2', label: 'Dark rug / hole' },
  { id: 'holeMode', type: 'select', group: 'Effects', label: 'Rug behaviour',
    options: [['sink', 'Darkens, drops away, comes back'], ['dark', 'Dark rug only'], ['pit', 'Hole stays open']] },
  { id: 'stairs',  type: 'toggle', group: 'Effects', key: '3', label: 'Dark doorway + stairs' },
  { id: 'flicker', type: 'toggle', group: 'Effects', key: '4', label: 'Flickering lights' },
  { id: 'sky',     type: 'select', group: 'Effects', label: 'Outside the window',
    options: [['day', 'Daylight'], ['night', 'Dark'], ['dusk', 'Dusk falls (90 s)']], hint: 'Choosing Dusk starts the fade again' },
  { id: 'audio',   type: 'toggle', group: 'Sound', key: '6', label: 'All sound' },
  { id: 'vol',     type: 'slider', group: 'Sound', label: 'Master volume', min: 0, max: 1, step: 0.05 },
  ...LAYERS.flatMap((L) => [
    { id: L.id,          type: 'toggle', group: 'Sound', label: L.label },
    { id: L.id + 'Vol',  type: 'slider', group: 'Sound', label: L.label + ' volume', min: 0, max: 1, step: 0.05 },
  ]),
  { id: 'hud',     type: 'toggle', group: 'Room PC', key: 'h', label: 'Status box on the projection' },
];
function getCtl(id) {
  if (id in on && id !== 'night') return on[id];
  if (id === 'holeMode') return HOLE_MODE;
  if (id === 'sky') return sky;
  if (id === 'vol') return VOL;
  if (id === 'hud') return showHud;
  if (layer[id]) return layer[id].on;
  if (id.endsWith('Vol') && layer[id.slice(0, -3)]) return layer[id.slice(0, -3)].vol;
}
function setCtl(id, v) {
  if (id === 'holeMode') HOLE_MODE = ['dark', 'pit', 'sink'].includes(v) ? v : 'sink';
  else if (id === 'sky') { sky = ['day', 'night', 'dusk'].includes(v) ? v : 'night'; on.night = sky !== 'day'; if (sky === 'dusk') duskFrom = sceneT(); }
  else if (id === 'vol') VOL = Math.max(0, Math.min(1, +v || 0));
  else if (id === 'hud') showHud = !!v;
  else if (layer[id]) layer[id].on = !!v;
  else if (id.endsWith('Vol') && layer[id.slice(0, -3)]) layer[id.slice(0, -3)].vol = Math.max(0, Math.min(1, +v || 0));
  else if (id in on) on[id] = !!v;
  if (id === 'audio' || layer[id]) startAudio();
  hud();
}
Remote.init({ title: 'Dementia triggers', controls: CONTROLS, get: getCtl, set: setCtl });
addEventListener('keydown', (ev) => {
  startAudio();
  if (ev.key === '5') { setCtl('sky', sky === 'day' ? 'night' : 'day'); Remote.changed('sky'); }   // 5: dark outside on/off
});
function hud() {
  const el = document.getElementById('hud');
  el.style.display = showHud ? 'block' : 'none';
  if (!showHud) return;
  el.textContent = `${fps} fps  ${cv.width}x${cv.height}  audio: ${actx ? actx.state : 'off'}\n` +
    CONTROLS.filter((c) => c.id !== 'hud').map((c) => { const v = getCtl(c.id);
      return `${(c.key || ' ').padEnd(2)}${c.label.padEnd(34)} ${typeof v === 'boolean' ? (v ? 'ON' : 'off') : typeof v === 'number' ? v.toFixed(2) : v}`; }).join('\n');
}
</script>
